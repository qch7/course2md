# course2md 配置文件示例（由 scripts/gen_config.py 生成，请勿手改）
# 复制到用户配置目录下的 config.toml（course2md doctor 会显示位置），
# 或用环境变量 COURSE2MD_CONFIG 指定路径。
# 优先级：命令行参数 > 环境变量（含 .env）> 本文件 > 默认值。
# 所有项都已注释，取消注释后生效。

# ---- 大模型接口（校对、长课证据与内置整理）
[llm]
# OpenAI 兼容接口的 API Key。也可用 DEEPSEEK_API_KEY 或 OPENAI_API_KEY。（环境变量 COURSE2MD_API_KEY）
# api_key = ""
# OpenAI 兼容接口地址，例如 https://api.openai.com/v1、http://127.0.0.1:11434/v1（Ollama）。（环境变量 COURSE2MD_LLM_BASE）
# base = "https://api.deepseek.com/v1"
# 内置整理与校对使用的模型名。（环境变量 COURSE2MD_LLM_MODEL）
# model = "deepseek-chat"
# 每次送给模型的最大字符数，课程过长时自动分块。（环境变量 COURSE2MD_CHUNK_CHARS）
# chunk_chars = 12000
# 内置接口所用模型支持图像输入时开启。（环境变量 COURSE2MD_LLM_VISION）
# vision = false

# ---- 整理后端（DSH / Codex / 内置）
[agent]
# 整理后端：dsh、codex、none（内置单次调用）或自定义命令；留空时装了 DSH 就用 DSH。（环境变量 COURSE2MD_AGENT）
# 例：backend = "dsh"
# backend = ""
# DSH 启动命令，留空自动探测桌面版或 PATH。（环境变量 COURSE2MD_DSH）
# dsh_command = ""
# DeepSeek Harness 桌面版安装目录，留空自动探测。（环境变量 COURSE2MD_DSH_HOME）
# dsh_home = ""
# DSH 使用的提供商（须已在 DSH 中登记），留空沿用 DSH 默认设置。（环境变量 COURSE2MD_DSH_PROVIDER）
# dsh_provider = ""
# DSH 使用的模型，留空沿用 DSH 默认设置。（环境变量 COURSE2MD_DSH_MODEL）
# dsh_model = ""
# Codex CLI 启动文件，留空从 PATH 探测。（环境变量 COURSE2MD_CODEX）
# codex_command = ""
# Codex 使用的提供商（须已在 ~/.codex/config.toml 登记），留空沿用其默认设置。（环境变量 COURSE2MD_CODEX_PROVIDER）
# codex_provider = ""
# Codex 使用的模型，留空沿用其默认设置。（环境变量 COURSE2MD_CODEX_MODEL）
# codex_model = ""
# Codex 推理强度。可选：minimal, low, medium, high, xhigh。（环境变量 COURSE2MD_CODEX_EFFORT）
# codex_effort = "medium"
# Agent 单次任务超时（秒）。（环境变量 COURSE2MD_AGENT_TIMEOUT）
# timeout = 1800

# ---- 转写（faster-whisper）
[asr]
# faster-whisper 模型名（large-v3 / medium / small）或本地模型目录。（环境变量 COURSE2MD_WHISPER_MODEL）
# model = "large-v3"
# 转写设备。可选：cuda, cpu。（环境变量 COURSE2MD_DEVICE）
# device = "cuda"
# 计算精度，留空时 GPU 用 int8_float16、CPU 用 int8。（环境变量 COURSE2MD_COMPUTE_TYPE）
# 例：compute_type = "int8_float16"
# compute_type = ""
# 转写语言。（环境变量 COURSE2MD_LANGUAGE）
# language = "zh"
# 解码束宽。（环境变量 COURSE2MD_BEAM_SIZE）
# beam_size = 5

# ---- 笔记与画面
[notes]
# 首选展示详细版笔记；关闭时首选缩略版，两版均会生成。（环境变量 COURSE2MD_DETAIL）
# detail = true
# 筛选并保存课件画面，供整理与 Markdown 配图使用。（环境变量 COURSE2MD_FRAMES）
# frames = true
# 画面采样间隔（秒），全课扫描最高使用 1 秒。（环境变量 COURSE2MD_FRAME_INTERVAL）
# frame_interval = 5.0
# 画面筛选策略：classroom（教室投影）、general（整幅画面变化）或已安装的插件名称。（环境变量 COURSE2MD_FRAME_SELECTOR）
# frame_selector = "classroom"
# 每批最多读取的截图数，整课画面总数不限。（环境变量 COURSE2MD_MAX_IMAGES）
# max_images = 12
# 去重后的画面超过该张数时，先用缩略图总览初筛，只读取入选画面的原图；0 表示关闭初筛。（环境变量 COURSE2MD_SCREEN_THRESHOLD）
# screen_threshold = 40
# 读图时同时发出的请求数（初筛各轮、读原图各批）；接口限流或本机资源紧张时调小，1 表示逐个发送。（环境变量 COURSE2MD_VISION_CONCURRENCY）
# vision_concurrency = 3

# ---- 输出
[output]
# 输出目录。（环境变量 COURSE2MD_OUT_DIR）
# dir = "course2md-output"
# 转写输出格式，可选 srt、vtt、txt、md、json。（环境变量 COURSE2MD_FORMATS）
# formats = ["srt", "txt", "md"]
# 网页任务成功写出产物后清理本任务下载的视频。（环境变量 COURSE2MD_DELETE_VIDEO）
# delete_video = true
# 学期第 1 周起始日（YYYY-MM-DD）；留空时按课程接口或最早课次推断。（环境变量 COURSE2MD_TERM_START）
# 例：term_start = "2026-09-07"
# term_start = ""

# ---- 来源解析插件
[resolvers]
# 开发时直接加载的解析器（模块:类），不必安装插件。（环境变量 COURSE2MD_RESOLVERS）
# 例：extra = "course2md_example:ExampleResolver"
# extra = []
# 按名称停用的解析器。（环境变量 COURSE2MD_DISABLED_RESOLVERS）
# disabled = []

# ---- 运行环境
[runtime]
# ffmpeg 路径；未安装时用 PyAV 解码音频。（环境变量 COURSE2MD_FFMPEG）
# ffmpeg = ""
# 模型缓存目录，留空使用 Hugging Face 默认位置。（环境变量 HF_HOME）
# hf_home = ""
# 模型下载镜像。（环境变量 HF_ENDPOINT）
# 例：hf_endpoint = "https://hf-mirror.com"
# hf_endpoint = ""

# ---- 网页服务与安全
[server]
# 关闭 HTTPS 证书校验，仅在可信网络排查证书问题时使用。（环境变量 COURSE2MD_INSECURE_TLS）
# insecure_tls = false
# 网页服务额外接受的主机名；用 --host 0.0.0.0 从局域网访问时填写。（环境变量 COURSE2MD_ALLOWED_HOSTS）
# allowed_hosts = []

# ---- 服务器部署（course2md server）
[deploy]
# 加密保存来源链接等凭证的密钥，服务器形态必须设置为随机字符串并妥善备份；更换后旧数据无法解密。（环境变量 COURSE2MD_SECRET_KEY）
# secret_key = ""
# 数据库地址，例如 postgresql+psycopg://user:pass@db/course2md；留空使用输出目录中的 SQLite。（环境变量 COURSE2MD_DATABASE_URL）
# database_url = ""
# 是否开放自助注册。closed 时由管理员在「管理」页创建账号；首个管理员凭服务启动日志中的初始化令牌创建，不受此项影响。可选：open, closed。（环境变量 COURSE2MD_REGISTRATION）
# registration = "closed"
# 信任其 X-Forwarded-* 头的反向代理地址，逗号分隔；容器部署中 Hub 不对外暴露时可设为 *。（环境变量 COURSE2MD_TRUSTED_PROXIES）
# trusted_proxies = "127.0.0.1"

# ---- 计算节点
[worker]
# 计算节点连接的 Hub 地址。（环境变量 COURSE2MD_HUB_URL）
# 例：hub = "https://course.example.com"
# hub = ""
# 计算节点令牌，由 Hub 的计算服务页或 course2md worker-token 生成。（环境变量 COURSE2MD_WORKER_TOKEN）
# token = ""
# 节点名称，默认取主机名。（环境变量 COURSE2MD_WORKER_NAME）
# name = ""
# 节点工作目录，下载的视频与中间文件放在这里。（环境变量 COURSE2MD_WORKER_DIR）
# work_dir = ""
# 节点本地视频缓存（media/）自动清理天数，超过该天数未更新的任务缓存将被删除；设为 0 关闭自动清理。（环境变量 COURSE2MD_WORKER_CACHE_DAYS）
# cache_days = "7"
