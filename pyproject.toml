[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "course2md"
version = "1.0.0"
description = "把课程回放（视频/链接）转成结构化 Markdown 笔记"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "course2md contributors" }]
keywords = ["lecture", "transcription", "whisper", "markdown", "notes", "obsidian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# 核心依赖不含转写与抽帧，服务器 Hub 只装这些。
dependencies = [
    "requests>=2.31",
    "numpy>=1.24",
    "Pillow>=10",
    "jsonschema>=4.18",
    "markdown-it-py>=3",
    "filelock>=3.13",
    "pydantic>=2.6",
    "platformdirs>=4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
# 转写、抽音频与抽帧（本地应用与计算节点）
asr = [
    "faster-whisper>=1.0",
    "av>=11",
    "opencv-python-headless>=4.8,<5",
    "onnxruntime<1.24; python_version < '3.11'",
]
# NVIDIA 运行库（Windows / Linux 上用 GPU 转写）
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
# 服务器形态：PostgreSQL 驱动与凭证加密
server = ["psycopg[binary]>=3.1", "cryptography>=42"]

[project.urls]
Homepage = "https://github.com/qch7/course2md"
Documentation = "https://github.com/qch7/course2md/tree/main/docs"
Issues = "https://github.com/qch7/course2md/issues"

[project.scripts]
course2md = "course2md.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "setuptools>=68",
    "wheel>=0.41",
    "import-linter>=2.15",
]
docs = ["mkdocs-material>=9.5"]

[tool.uv]
# 锁文件必须同时满足 Windows 与 Linux（CUDA 运行库并非每个版本都提供 Windows 轮子）
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["course2md*"]

[tool.setuptools.package-data]
"course2md" = ["web_dist/*", "web_dist/assets/*"]
"course2md.core" = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not gpu and not network and not agent'"
markers = [
    "gpu: 需要 CUDA 显卡（COURSE2MD_TEST_GPU=1 时运行：pytest -m gpu）",
    "network: 访问外部网络",
    "agent: 调用真实的 DSH / Codex CLI",
    "integration: 跨模块或启动子进程的较慢测试",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["asrlibs", "tmp-test", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL", "BLE", "PIE", "C4", "PTH", "RUF"]
ignore = [
    "E501",     # 长行由格式化处理，中文注释不强行折行
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    "PLC0415",  # 可选依赖需要在函数内导入
    "PLW0603",
    "SIM105", "SIM108",
    "B008",     # FastAPI 依赖注入写法
    "PLR0917",  # 参数较多的内部函数保持现有签名
    "SIM112",   # 环境变量名由外部约定
    "RUF001", "RUF002", "RUF003",  # 中文全角标点是正文，不是易混字符
    "PTH105", "PTH108",  # 原子替换常作用于 mkstemp 返回的字符串路径
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "B011", "PLW", "RUF059"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["course2md"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

# 分层约束：上层可以导入下层，反之不行；同一层用 | 分隔的模块彼此独立。
# 运行：uv run lint-imports
[tool.importlinter]
root_package = "course2md"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Application layers"
type = "layers"
layers = [
    "course2md.cli",
    "course2md.hub",
    "course2md.jobs",
    "course2md.worker",
    "course2md.pipeline",
    "course2md.stages",
    "course2md.export | course2md.doctor",
    "course2md.refine",
    "course2md.asr",
    "course2md.config",
    "course2md.agents | course2md.resolvers | course2md.frame_selectors | course2md.core",
    "course2md.plugins | course2md.storage | course2md.util | course2md.errors",
]

[[tool.importlinter.contracts]]
name = "Plugin APIs depend only on infrastructure"
type = "forbidden"
source_modules = ["course2md.resolvers.api", "course2md.frame_selectors.api", "course2md.agents.api"]
forbidden_modules = ["course2md.hub", "course2md.jobs", "course2md.worker", "course2md.pipeline", "course2md.stages", "course2md.config"]
